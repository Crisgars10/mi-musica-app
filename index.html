<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://api.github.com; media-src blob:; img-src 'self' data: blob:; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="google" content="notranslate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Música">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Mi Música</title>
<style>
:root{--bg:#121212;--bg2:#181818;--card:#242424;--hi:#2a2a2a;--line:#2e2e2e;--txt:#fff;--mute:#a7a7a7;--acc:#ff4f6d;--acc2:#ff8a5c;--acct:#fff;--red:#f15e6c;
--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
body{padding-top:var(--safe-t)}
button{font:inherit;color:inherit}
.view{display:none;padding:0 0 calc(150px + var(--safe-b))}
.view.on{display:block}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;gap:10px}
.top h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.3px}
.ib{background:none;border:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--txt)}
.ib:active{background:var(--hi)}
.ib svg{width:24px;height:24px}
h2.sec{font-size:21px;margin:22px 16px 10px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 16px}
.tile{display:flex;align-items:center;gap:10px;background:var(--hi);border-radius:6px;overflow:hidden;height:56px;cursor:pointer;font-weight:700;font-size:13px}
.tile:active{opacity:.7}
.tile .art{width:56px;height:56px;border-radius:0}
.tile span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding-right:6px}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.card{flex:none;width:140px;cursor:pointer}
.card .art{width:140px;height:140px;border-radius:6px;font-size:48px}
.card .t{font-size:14px;margin-top:8px;font-weight:600}
.card .a{font-size:12px}
.art{flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background-size:cover;background-position:center;border-radius:4px;position:relative;overflow:hidden}
.art.sm{width:48px;height:48px;font-size:20px}
.artc{width:100%;height:100%;font-size:48px;border-radius:0}
.art svg{width:45%;height:45%}
.meta{flex:1;min-width:0}
.t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t.on{color:var(--acc)}
.a{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.heart-s{color:var(--acc);margin-right:4px}
.list{padding:0 8px}
.row{display:flex;align-items:center;gap:12px;padding:7px 8px;border-radius:6px;cursor:pointer}
.row:active{background:var(--hi)}
.dots{background:none;border:0;color:var(--mute);padding:10px 6px;cursor:pointer;display:grid;place-items:center}
.dots svg{width:20px;height:20px}
.empty{text-align:center;color:var(--mute);padding:40px 30px;line-height:1.5;font-size:15px}
.pill{background:var(--hi);border:0;color:var(--txt);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;flex:none}
.pill.on{background:var(--acc);color:var(--acct)}
.pills{display:flex;gap:8px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.searchbox{margin:6px 16px 12px;display:flex;align-items:center;gap:8px;background:#fff;color:#000;border-radius:8px;padding:0 12px}
.searchbox svg{width:22px;height:22px;flex:none;color:#333}
.searchbox input{flex:1;border:0;outline:none;background:none;font-size:16px;padding:12px 0;color:#000}
/* playlist page */
.phead{padding:10px 16px 6px;position:relative}
.phead .back{position:absolute;left:8px;top:6px}
.pcover{width:200px;height:200px;margin:34px auto 16px;box-shadow:0 8px 40px rgba(0,0,0,.5);border-radius:4px;font-size:70px}
.pname{font-size:24px;font-weight:800;margin:0 0 4px;word-break:break-word}
.psub{color:var(--mute);font-size:13px}
.pact{display:flex;align-items:center;gap:6px;padding:10px 12px 8px 8px}
.pact .grow{flex:1}
.bigplay{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acct);display:grid;place-items:center;cursor:pointer}
.bigplay svg{width:26px;height:26px}
.tog{color:var(--mute)}
.tog.on{color:var(--acc)}
.tog.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc)}
.ib.tog{position:relative}
/* mini player */
#mini{position:fixed;left:8px;right:8px;bottom:calc(62px + var(--safe-b));background:#3a2a35;border-radius:8px;display:none;align-items:center;gap:10px;padding:8px;z-index:5;cursor:pointer;overflow:hidden}
#mini.on{display:flex}
#mini .art{width:40px;height:40px;font-size:16px}
#mini .t{font-size:14px;font-weight:600}
#mini .a{font-size:12px;color:#ddd}
#miniProg{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:rgba(255,255,255,.25);border-radius:2px}
#miniProg i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
/* tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:linear-gradient(to top,rgba(0,0,0,.98) 60%,rgba(0,0,0,.8));padding:6px 0 calc(6px + var(--safe-b));z-index:4}
#tabbar button{flex:1;background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer;padding:4px 0}
#tabbar button.on{color:#fff}
#tabbar svg{width:25px;height:25px}
/* full player */
#full{position:fixed;inset:0;z-index:20;transform:translateY(100%);transition:transform .28s ease;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 8px) 22px calc(20px + var(--safe-b));background:#333}
#full.on{transform:none}
.fhead{display:flex;align-items:center;justify-content:space-between}
.fhead .ctxname{text-align:center;font-size:12px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead .ctxname small{display:block;font-weight:400;color:#ddd;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.fart{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:20px 0}
.fart .art{width:min(84vw,46vh);height:min(84vw,46vh);border-radius:6px;font-size:110px;box-shadow:0 10px 50px rgba(0,0,0,.45)}
.finfo{display:flex;align-items:center;gap:10px}
.finfo .t{font-size:22px;font-weight:800}
.finfo .a{font-size:16px;color:#ddd}
.like svg{width:28px;height:28px}
.like.on{color:var(--acc)}
.fprog{margin-top:14px}
.fprog input{width:100%;accent-color:#fff;margin:0}
.ftimes{display:flex;justify-content:space-between;font-size:11px;color:#ddd;margin-top:2px}
.fctrl{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.fctrl .ib svg{width:30px;height:30px}
.fctrl .ib.big{width:68px;height:68px;background:#fff;color:#000}
.fctrl .ib.big svg{width:32px;height:32px}
.fctrl .tog svg{width:24px;height:24px}
.rep1{position:absolute;font-size:9px;font-weight:800;top:9px;right:7px}
.fbottom{display:flex;justify-content:space-between;margin-top:14px}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:40}
.sheet.on{display:flex}
.sheet .box{background:#282828;width:100%;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:10px 0 calc(14px + var(--safe-b))}
.mhead{display:flex;align-items:center;gap:12px;padding:8px 18px 14px;border-bottom:1px solid #3a3a3a;margin-bottom:6px}
.mitem{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;text-align:left;padding:14px 20px;font-size:16px;cursor:pointer}
.mitem:active{background:#333}
.mitem svg{width:24px;height:24px;color:var(--mute);flex:none}
.mitem.danger{color:var(--red)}
.mitem.danger svg{color:var(--red)}
.form{padding:10px 20px}
.form h3{margin:4px 0 10px;font-size:20px}
.form p{color:var(--mute);font-size:14px;line-height:1.45;margin:6px 0}
.form label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.form input,.form select{width:100%;background:#3e3e3e;border:0;color:var(--txt);border-radius:6px;padding:12px;font-size:16px;outline:none}
.brow{display:flex;gap:10px;margin-top:18px}
.brow button{flex:1;padding:13px;border-radius:999px;border:0;font-size:15px;font-weight:700;cursor:pointer}
.bprim{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acct)}
.bsec{background:transparent;color:#fff;border:1px solid #777!important}
.bdanger{background:transparent;color:var(--red);border:1px solid var(--red)!important}
.err{color:var(--red)!important}
.meter{height:6px;background:#3e3e3e;border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--acc)}
.qlabel{font-size:15px;font-weight:700;padding:14px 18px 6px}
#toast{position:fixed;left:50%;bottom:calc(140px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;max-width:88vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#upbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:70;display:none}
#upbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#upmsg{margin:0 16px;font-size:13px;color:var(--mute);min-height:0}
</style>
</head>
<body>
<div id="upbar"><i></i></div>

<!-- INICIO -->
<section class="view on" id="v-home">
  <div class="top"><h1 id="greet">Hola</h1>
    <div style="display:flex"><button class="ib" data-act="upload" title="Subir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ib" data-act="settings" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </div>
  <div id="upmsg"></div>
  <div id="homeBody"><div class="empty">Cargando…</div></div>
</section>

<!-- BUSCAR -->
<section class="view" id="v-search">
  <div class="top"><h1>Buscar</h1></div>
  <div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="¿Qué quieres escuchar?" autocomplete="off" autocorrect="off"></div>
  <div id="searchBody"></div>
</section>

<!-- BIBLIOTECA -->
<section class="view" id="v-lib">
  <div class="top"><h1>Tu biblioteca</h1>
    <button class="ib" data-act="newpl" title="Crear playlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="pills" id="libPills"></div>
  <div id="libBody"></div>
</section>

<!-- DETALLE (playlist / todas / me gusta / artista) -->
<section class="view" id="v-detail"><div id="detailBody"></div></section>

<!-- MINI PLAYER -->
<div id="mini" data-act="openfull">
  <div class="art" id="miniArt"></div>
  <div class="meta"><div class="t" id="miniT"></div><div class="a" id="miniA"></div></div>
  <button class="ib like" id="miniLike" data-act="likecur"></button>
  <button class="ib" id="miniPP" data-act="pp"></button>
  <div id="miniProg"><i></i></div>
</div>

<!-- TAB BAR -->
<nav id="tabbar">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10v11h6v-7h6v7h6V10z"/></svg>Inicio</button>
  <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Buscar</button>
  <button data-tab="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 3v18M9 3v18M14 4l6 16"/></svg>Tu biblioteca</button>
</nav>

<!-- FULL PLAYER -->
<div id="full">
  <div class="fhead">
    <button class="ib" data-act="closefull"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="ctxname"><small>Reproduciendo desde</small><span id="fCtx"></span></div>
    <button class="ib" data-act="curmenu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div class="fart"><div class="art" id="fArt"></div></div>
  <div class="finfo"><div class="meta"><div class="t" id="fT"></div><div class="a" id="fA"></div></div><button class="ib like" id="fLike" data-act="likecur"></button></div>
  <div class="fprog"><input type="range" id="seek" min="0" max="1000" value="0"><div class="ftimes"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
  <div class="fctrl">
    <button class="ib tog" id="fShuf" data-act="shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button class="ib" data-act="prev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="ib big" id="fPP" data-act="pp"></button>
    <button class="ib" data-act="next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="ib tog" id="fRep" data-act="repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg><span class="rep1" id="rep1"></span></button>
  </div>
  <div class="fbottom">
    <span></span>
    <button class="ib" data-act="queue" title="Cola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h13M3 12h13M3 18h9M19 14v7M16 18l3 3 3-3"/></svg></button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<div id="toast"></div>
<input type="file" id="imgFile" accept="image/*" hidden>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.webm" multiple hidden>
<audio id="au" preload="auto" playsinline></audio>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const au = $("au");
const AUDIO_RE = /\.(mp3|m4a|aac|wav|flac|ogg|opus|webm|aiff?|caf)$/i;
const MIME = { mp3:"audio/mpeg", m4a:"audio/mp4", aac:"audio/aac", wav:"audio/wav", flac:"audio/flac", ogg:"audio/ogg", opus:"audio/ogg", webm:"audio/webm", aif:"audio/aiff", aiff:"audio/aiff", caf:"audio/x-caf" };
const LIB_FILE = "mimusica.json";
const COVER_DIR = "portadas";

// ---------- iconos ----------
const I = {
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8 3.4 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.6 0 6 3.5 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>',
  heartF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8 3.4 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.6 0 6 3.5 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  addpl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h12M3 12h12M3 18h7M18 13v8M14 17h8"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4v16l10-8z"/><path d="M19 5v14"/></svg>',
  queue:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h13M3 12h13M3 18h9M19 14v7M16 18l3 3 3-3"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>',

async function gh(path, opts = {}) {

}

  imgOk = false; imgWrite = false; imgErr = ""; imgSha = {}; imgIndex = new Map();

    imgWrite = !!(info.permissions && info.permissions.push);
    let tree = [];
    try { tree = (await (await gh(`${imgRepoPath()}/git/trees/${encodeURIComponent(info.default_branch || "main")}?recursive=1`)).json()).tree || []; }
    catch(e) { if (e.status !== 409 && e.status !== 404) throw e; }
    for (const x of tree) if (x.type === "blob" && IMG_RE.test(x.path)) {

}
const b64enc = str => { const bytes = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };

async function fetchLib() {
  try {
    const j = await (await gh(`${repoPath()}/contents/${LIB_FILE}`)).json();
    const data = JSON.parse(b64dec(j.content || ""));
    return { lib: sanitizeLib(data), sha: j.sha };

    if (e.status === 404) return { lib: { v: 1, songs: {}, playlists: [] }, sha: null };

  }
}
function sanitizeLib(d) {

  if (d && typeof d.songs === "object" && d.songs) for (const [k, v] of Object.entries(d.songs)) if (v && typeof v === "object") out.songs[k] = v;
  if (d && Array.isArray(d.playlists)) out.playlists = d.playlists.filter(p => p && p.id && typeof p.name === "string").map(p => ({ ...p, songs: Array.isArray(p.songs) ? p.songs.filter(x => typeof x === "string") : [] }));
  return out;
}
let pendingMuts = [], flushing = false, flushT = null;
function mutate(fn) {
  if (!canWrite) { toast("Tu llave no permite guardar cambios."); return; }
  fn(lib); pendingMuts.push(fn); rebuild(); renderAll();
  clearTimeout(flushT); flushT = setTimeout(flush, 500);
}
async function flush() {
  if (flushing) { clearTimeout(flushT); flushT = setTimeout(flush, 400); return; }
  flushing = true;
  let tries = 0;
  while (pendingMuts.length) {
    const n = pendingMuts.length;
    try {
      const body = { message: "Actualizar biblioteca", content: b64enc(JSON.stringify(lib, null, 1)) };
      if (libSha) body.sha = libSha;
      const j = await (await gh(`${repoPath()}/contents/${LIB_FILE}`, { method: "PUT", body: JSON.stringify(body) })).json();
      libSha = j.content && j.content.sha; pendingMuts.splice(0, n); tries = 0;
    } catch(e) {
      if ((e.status === 409 || e.status === 422) && tries < 3) {
        tries++;
        const r = await fetchLib().catch(() => null);
        if (r) { lib = r.lib; libSha = r.sha; for (const f of pendingMuts) f(lib); rebuild(); renderAll(); }
        continue;
      }
      toast("No se pudo guardar: " + explain(e)); break;
    }
  }

}

function guessMeta(path) {
  const name = path.split("/").pop();
  let base = name.replace(/\.[^.]+$/, "").replace(/_/g, " ").replace(/\s*\([0-9a-z]{6,}\)$/i, "").replace(/^\d+[\s.\-]+/, "").trim();
  const p = base.split(" - ");
  return p.length >= 2 ? { artist: p[0].trim(), title: p.slice(1).join(" - ").trim() } : { artist: "Artista desconocido", title: base };
}
function rebuild() {
  const pre = dirPrefix(); const preS = pre ? pre + "/" : "";
  byPath = new Map();
  allSongs = files.map(f => {
    const m = lib.songs[f.path] || {};
    const g = guessMeta(f.path);
    const rel = f.path.slice(preS.length); const parts = rel.split("/");
    const title = m.title || g.title, artist = m.artist || g.artist;
    const fileBase = f.path.split("/").pop().replace(/\.[^.]+$/, "");
    // prioridad: imagen elegida en la app > imagen con el mismo nombre en el repo de imágenes > portada del MP3 > foto del artista
    let cover = null, coverOwn = true;
    const byName = imgIndex.get(nkey(artist + " - " + title)) || imgIndex.get(nkey(fileBase)) || imgIndex.get(nkey(title));
    if (m.cover && m.cover.startsWith("i:") && hasCover(m.cover)) cover = m.cover;
    else if (byName) cover = byName;
    else if (m.cover && hasCover(m.cover)) cover = m.cover;
    else { cover = imgIndex.get(nkey(artist)) || null; coverOwn = false; }
    const s = { path: f.path, sha: f.sha, size: f.size, title, artist, liked: !!m.liked, likedAt: m.likedAt || 0, added: m.added || 0, cover, coverOwn: coverOwn && !!cover, folder: parts.length > 1 ? parts.slice(0, -1).join(" / ") : "" };
    byPath.set(f.path, s); return s;
  });
}
const sortAZ = arr => arr.slice().sort((a, b) => norm(a.title).localeCompare(norm(b.title), "es"));
const sortRecent = arr => arr.slice().sort((a, b) => (b.added - a.added) || norm(a.title).localeCompare(norm(b.title), "es"));
const likedSongs = () => allSongs.filter(s => s.liked).sort((a, b) => b.likedAt - a.likedAt);
const plSongs = pl => pl.songs.map(p => byPath.get(p)).filter(Boolean);

const artists = () => { const m = new Map(); for (const s of allSongs) m.set(s.artist, (m.get(s.artist) || 0) + 1); return [...m].sort((a, b) => b[1] - a[1]); };

function ctxSongs(key) {
  if (key === "all") return sortMode() === "az" ? sortAZ(allSongs) : sortRecent(allSongs);
  if (key === "liked") return likedSongs();
  if (key === "recent") return sortRecent(allSongs).slice(0, 30);

  if (key.startsWith("fd:")) return sortAZ(allSongs.filter(s => s.folder === key.slice(3)));

}
function ctxName(key) {

// ---------- portadas ----------
const coverUrl = new Map(); const coverWait = new Map();
let coverActive = 0; const coverQ = [];
function loadCover(path) {
  if (coverUrl.has(path)) return Promise.resolve(coverUrl.get(path));
  if (coverWait.has(path)) return coverWait.get(path);
  const p = new Promise((res) => { coverQ.push({ path, res }); pumpCovers(); });
  coverWait.set(path, p); return p;
}
async function pumpCovers() {
  while (coverActive < 4 && coverQ.length) {
    const { path, res } = coverQ.shift(); coverActive++;
    (async () => {
      try {
        const isI = path.startsWith("i:");
        const r = await gh(`${isI ? imgRepoPath() : repoPath()}/git/blobs/${isI ? imgSha[path] : coverSha[path]}`, { accept: "application/vnd.github.raw" });
        const ext = path.split(".").pop().toLowerCase();
        const url = URL.createObjectURL(new Blob([await r.arrayBuffer()], { type: ext === "png" ? "image/png" : ext === "webp" ? "image/webp" : ext === "gif" ? "image/gif" : ext === "heic" ? "image/heic" : "image/jpeg" }));
        coverUrl.set(path, url); res(url);
      } catch(e) { res(null); }
      coverActive--; coverWait.delete(path); pumpCovers();
    })();
  }
}
function artHTML(s, cls = "sm", fallbackIcon) {

  const c = s.cover;
  const url = c && coverUrl.get(c);
  const st = url ? `background-image:url('${url}')` : `background:${grad(s.artist)}`;
  return `<div class="art ${cls}" ${c && !url ? `data-cover="${esc(c)}"` : ""} style="${st}">${url ? "" : (fallbackIcon || esc((s.title||"?")[0].toUpperCase()))}</div>`;
}
function hydrateCovers(root = document) {

    const c = el.getAttribute("data-cover");

}
function artistArt(a) {

// ---------- ID3 (título, artista y portada de los MP3) ----------
function readID3(u8) {
  const out = {};
  try {
    if (u8.length < 10 || u8[0] !== 0x49 || u8[1] !== 0x44 || u8[2] !== 0x33) return out;
    const ver = u8[3], flags = u8[5];
    const ss = (a, b, c, d) => (a << 21) | (b << 14) | (c << 7) | d;
    const size = ss(u8[6], u8[7], u8[8], u8[9]);
    let p = 10; const end = Math.min(u8.length, 10 + size);
    if (flags & 0x40) { const ext = ver === 4 ? ss(u8[10], u8[11], u8[12], u8[13]) : ((u8[10] << 24) | (u8[11] << 16) | (u8[12] << 8) | u8[13]) + 4; p += ext; }

      const enc = b[0]; let d = b.subarray(1);

      else if (enc === 3) s = new TextDecoder("utf-8").decode(d);
      else if (enc === 1) { const le = !(d[0] === 0xFE && d[1] === 0xFF); if ((d[0] === 0xFF && d[1] === 0xFE) || (d[0] === 0xFE && d[1] === 0xFF)) d = d.subarray(2); s = new TextDecoder(le ? "utf-16le" : "utf-16be").decode(d.subarray(0, d.length & ~1)); }
      else s = new TextDecoder("utf-16be").decode(d.subarray(0, d.length & ~1));
      return s.replace(/\u0000.*$/s, "").trim();
    };
    const skipStr = (b, i, enc) => { if (enc === 1 || enc === 2) { while (i + 1 < b.length && !(b[i] === 0 && b[i + 1] === 0)) i += 2; return i + 2; } while (i < b.length && b[i] !== 0) i++; return i + 1; };
    const v2 = ver === 2, idLen = v2 ? 3 : 4, hLen = v2 ? 6 : 10;
    while (p + hLen <= end) {
      const id = String.fromCharCode(...u8.subarray(p, p + idLen));
      if (!/^[A-Z0-9]+$/.test(id)) break;
      let fs;
      if (v2) fs = (u8[p + 3] << 16) | (u8[p + 4] << 8) | u8[p + 5];
      else if (ver === 4) fs = ss(u8[p + 4], u8[p + 5], u8[p + 6], u8[p + 7]);
      else fs = ((u8[p + 4] << 24) >>> 0) + (u8[p + 5] << 16) + (u8[p + 6] << 8) + u8[p + 7];
      const b = u8.subarray(p + hLen, Math.min(end, p + hLen + fs));

      else if (id === "TPE1" || id === "TP1") out.artist = decText(b);

        if (v2) { mime = "image/" + String.fromCharCode(b[1], b[2], b[3]).toLowerCase().replace("jpg", "jpeg"); i = 4; }
        else { const j = skipStr(b, 1, 0); mime = Array.from(b.subarray(1, j - 1), c => String.fromCharCode(c)).join("") || "image/jpeg"; i = j; }
        i += 1; i = skipStr(b, i, enc);
        if (i < b.length) out.pic = { mime: mime.includes("/") ? mime : "image/" + mime, data: b.slice(i) };
      }
      p += hLen + fs;
    }
  } catch(e) {}

}
async function makeCover(pic) {

    const S = 400, c = document.createElement("canvas"); c.width = S; c.height = S;
    const sc = Math.max(S / bmp.width, S / bmp.height); const w = bmp.width * sc, h = bmp.height * sc;

// ---------- datos de M4A (título, artista y portada) ----------
function readMP4(u8) {
  const out = {};
  try {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const typ = p => String.fromCharCode(u8[p], u8[p + 1], u8[p + 2], u8[p + 3]);
    const boxes = (start, end) => { const r = []; let p = start; while (p + 8 <= end) { let size = dv.getUint32(p), hdr = 8; const t = typ(p + 4); if (size === 1) { size = Number(dv.getBigUint64(p + 8)); hdr = 16; } else if (size === 0) size = end - p; if (size < hdr || p + size > end) break; r.push({ t, s: p + hdr, e: p + size }); p += size; } return r; };
    const find = (list, t) => list.find(b => b.t === t);
    const moov = find(boxes(0, u8.length), "moov"); if (!moov) return out;
    const udta = find(boxes(moov.s, moov.e), "udta"); if (!udta) return out;
    const meta = find(boxes(udta.s, udta.e), "meta"); if (!meta) return out;
    const ilst = find(boxes(meta.s + 4, meta.e), "ilst"); if (!ilst) return out;
    for (const it of boxes(ilst.s, ilst.e)) {
      const d = find(boxes(it.s, it.e), "data"); if (!d) continue;
      const kind = dv.getUint32(d.s) & 0xffffff, val = u8.subarray(d.s + 8, d.e);
      const key = it.t;
      if (key === "\u00a9nam") out.title = new TextDecoder().decode(val).trim();
      else if (key === "\u00a9ART" || (key === "aART" && !out.artist)) out.artist = new TextDecoder().decode(val).trim();
      else if (key === "covr" && !out.pic) out.pic = { mime: kind === 14 ? "image/png" : "image/jpeg", data: val.slice() };
    }
  } catch(e) {}
  return out;
}
const readTags = (u8, name) => /\.(m4a|mp4|aac|alac)$/i.test(name) ? readMP4(u8) : readID3(u8);

  }

}

// ---------- compresión a Opus (WebM) en el propio iPhone ----------
function makeWebm(packets, opts) {
  // packets: [{data: Uint8Array, ts: microseconds}] ; opts: {channels, sampleRate, durationMs, opusHead?}
  const enc = new TextEncoder();
  const idBytes = id => { const b = []; let v = id; while (v > 0) { b.unshift(v & 255); v = Math.floor(v / 256); } return b; };
  const sizeBytes = n => { // EBML vint, 8 bytes max
    for (let len = 1; len <= 8; len++) {
      if (n < Math.pow(2, 7 * len) - 1) {
        const out = new Array(len); let v = n;
        for (let i = len - 1; i >= 0; i--) { out[i] = v % 256; v = Math.floor(v / 256); }
        out[0] |= 1 << (8 - len);
        return out;
      }
    }
    throw new Error("too big");
  };
  const uint = n => { const b = []; do { b.unshift(n % 256); n = Math.floor(n / 256); } while (n > 0); return b; };
  const concat = arrs => { let len = 0; for (const a of arrs) len += a.length; const out = new Uint8Array(len); let o = 0; for (const a of arrs) { out.set(a, o); o += a.length; } return out; };

  const elU = (id, n) => el(id, uint(n));
  const elS = (id, s) => el(id, enc.encode(s));
  const elF = (id, f) => { const b = new Uint8Array(8); new DataView(b.buffer).setFloat64(0, f); return el(id, b); };

  const ch = opts.channels, sr = opts.sampleRate;
  let head = opts.opusHead;
  if (!head || head.length < 19) {
    head = new Uint8Array(19); const dv = new DataView(head.buffer);
    head.set(enc.encode("OpusHead"), 0); head[8] = 1; head[9] = ch;
    dv.setUint16(10, 312, true); dv.setUint32(12, sr, true); dv.setInt16(16, 0, true); head[18] = 0;
  }
  const ebml = el(0x1A45DFA3, concat([elU(0x4286, 1), elU(0x42F7, 1), elU(0x42F2, 4), elU(0x42F3, 8), elS(0x4282, "webm"), elU(0x4287, 4), elU(0x4285, 2)]));

    elU(0xD7, 1), elU(0x73C5, 1), elU(0x83, 2), elS(0x86, "A_OPUS"), el(0x63A2, head),
    elU(0x56AA, 6500000), elU(0x56BB, 80000000),
    el(0xE1, concat([elF(0xB5, sr), elU(0x9F, ch)]))
  ])));

  // Clusters of ~2s each
  const clusters = []; let i = 0;
  while (i < packets.length) {
    const startMs = Math.floor(packets[i].ts / 1000);
    const blocks = [elU(0xE7, startMs)];
    while (i < packets.length) {
      const rel = Math.round(packets[i].ts / 1000) - startMs;
      if (rel > 2000 || rel > 32767) break;
      const hdr = new Uint8Array(4); hdr[0] = 0x81; new DataView(hdr.buffer).setInt16(1, rel); hdr[3] = 0x80;
      blocks.push(el(0xA3, concat([hdr, packets[i].data])));
      i++;
    }
    clusters.push({ timeMs: startMs, bytes: el(0x1F43B675, concat(blocks)) });
  }
  // Cues: positions relative to segment data start. Layout: Info, Tracks, Cues(placeholder-size computed iteratively), Clusters
  let cuesBytes = new Uint8Array(0);
  for (let pass = 0; pass < 3; pass++) {
    let pos = info.length + tracks.length + cuesBytes.length;
    const points = [];
    for (const c of clusters) {
      points.push(el(0xBB, concat([elU(0xB3, c.timeMs), el(0xB7, concat([elU(0xF7, 1), elU(0xF1, pos)]))])));
      pos += c.bytes.length;
    }
    cuesBytes = el(0x1C53BB6B, concat(points));
  }
  const segBody = concat([info, tracks, cuesBytes, ...clusters.map(c => c.bytes)]);
  const segment = el(0x18538067, segBody);
  return concat([ebml, segment]);
}


async function toWebm(file, onProg, kbps){
  if (typeof AudioEncoder === "undefined" || typeof AudioData === "undefined") throw new Error("NOENC");
  const cfg = { codec: "opus", sampleRate: 48000, numberOfChannels: 2, bitrate: (kbps || 96) * 1000 };
  try { const s = await AudioEncoder.isConfigSupported(cfg); if (!s.supported) throw 0; } catch(e) { throw new Error("NOENC"); }
  const ab = await file.arrayBuffer();
  const ctx = new OfflineAudioContext(2, 48000, 48000);
  const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
  const L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
  const packets = []; let head = null, err = null;
  const encoder = new AudioEncoder({
    output: (chunk, meta) => {
      const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d);
      packets.push({ data: d, ts: chunk.timestamp });
      const desc = meta && meta.decoderConfig && meta.decoderConfig.description;
      if (desc && !head) {
        const u = desc instanceof ArrayBuffer ? new Uint8Array(desc) : new Uint8Array(desc.buffer, desc.byteOffset, desc.byteLength);
        if (u.length >= 19 && String.fromCharCode(...u.slice(0, 8)) === "OpusHead") head = u.slice();
      }
    },
    error: e => { err = e; }
  });
  encoder.configure(cfg);
  const N = buf.length, step = 48000;
  for (let off = 0; off < N; off += step) {
    if (err) throw err;
    const n = Math.min(step, N - off);
    const data = new Float32Array(n * 2);
    data.set(L.subarray(off, off + n), 0); data.set(R.subarray(off, off + n), n);
    const ad = new AudioData({ format: "f32-planar", sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(off / 48000 * 1e6), data });
    encoder.encode(ad); ad.close();
    if (encoder.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 0));
    if (onProg) onProg(off / N);
  }
  await encoder.flush(); encoder.close();
  if (err) throw err;
  if (!packets.length) throw new Error("vacío");
  packets.sort((a, b) => a.ts - b.ts);
  const out = makeWebm(packets, { channels: 2, sampleRate: 48000, durationMs: buf.duration * 1000, opusHead: head });
  return new Blob([out], { type: "video/webm" });
}

    }
    case "rmfrom": closeSheet(); mutate(l => { const q = l.playlists.find(p => p.id === id); if (q) q.songs = q.songs.filter(p => p !== path); }); toast("Quitada de la playlist"); break;
    case "playnext": closeSheet(); unlockAudio(); if (!current) { ctx = { key: "", list: [] }; order = []; pos = -1; upNext = []; playPath(path); } else { upNext.unshift(path); toast("Sonará a continuación"); } break;
    case "addqueue": closeSheet(); unlockAudio(); if (!current) { ctx = { key: "", list: [] }; order = []; pos = -1; playPath(path); } else { upNext.push(path); toast("Añadida a la cola"); } break;
    case "rename": {
      const s = byPath.get(path);
      promptSheet({ title: "Cambiar nombre", fields: [{ label: "Título", value: s.title }, { label: "Artista", value: s.artist }], ok: "Guardar", onOk: ([t, a]) => {
        if (!t) return false;
        mutate(l => { l.songs[path] = { ...(l.songs[path] || {}), title: t, artist: a || "Artista desconocido" }; });
        toast("Nombre cambiado");
      }});
      break;
    }
    case "delsong": {
      const s = byPath.get(path);
      confirmSheet("¿Borrar canción?", `Se borrará <b>${esc(s.title)}</b> de GitHub y de todas tus playlists. No se puede deshacer.`, "Borrar", async () => {
        try {
          await gh(`${repoPath()}/contents/${encPath(path)}`, { method: "DELETE", body: JSON.stringify({ message: "Borrar " + path.split("/").pop(), sha: s.sha }) });
          files = files.filter(f => f.path !== path); totalBytes -= s.size || 0;
          upNext = upNext.filter(p => p !== path);
          mutate(l => { delete l.songs[path]; for (const p of l.playlists) p.songs = p.songs.filter(x => x !== path); });
          toast("Canción borrada");
        } catch(err) { toast(explain(err)); }
      });
      break;
    }
    case "newpl": closeSheet(); setTimeout(() => newPlaylist(paths), 30); break;
    case "plmenu": {
      const pl = lib.playlists.find(p => p.id === id);
      openSheet(`<div class="mhead">${plCoverHTML("pl:" + id, "sm")}<div class="meta"><div class="t">${esc(pl.name)}</div><div class="a">${nCanc(plSongs(pl).length)}</div></div></div>` +
        mi("addsongs", I.addpl, "Añadir canciones", `data-id="${esc(id)}"`) + mi("renpl", I.edit, "Cambiar nombre", `data-id="${esc(id)}"`) + mi("plimg", I.image, (hasCover(pl.cover) || imgIndex.get(nkey(pl.name))) ? "Cambiar imagen" : "Poner imagen", `data-id="${esc(id)}"`) + ((hasCover(pl.cover) || imgIndex.get(nkey(pl.name))) ? mi("plimgrm", I.minus, "Quitar imagen", `data-id="${esc(id)}"`) : "") +
        mi("addqueuepl", I.queue, "Añadir a la cola", `data-id="${esc(id)}"`) + mi("delpl", I.trash, "Borrar playlist", `data-id="${esc(id)}"`, "danger"));
      break;
    }
    case "songimg": closeSheet(); pickImage({ type: "song", path }); break;
    case "songimgrm": {
      closeSheet(); const s = byPath.get(path); if (!s) break;
      (async () => {
        if (s.cover && s.cover.startsWith("i:")) { const ok = await delImage(s.cover); if (!ok) return; }
        mutate(l => { l.songs[path] = { ...(l.songs[path] || {}), cover: null }; }); toast("Portada quitada");
      })(); break;
    }
    case "armenu": {
      const a = el.dataset.name; const has = !!imgIndex.get(nkey(a));
      openSheet(`<div class="mhead"><div style="width:48px;height:48px;border-radius:50%;overflow:hidden">${artistArt(a)}</div><div class="meta"><div class="t">${esc(a)}</div><div class="a">Artista</div></div></div>` +
        mi("artimg", I.image, has ? "Cambiar foto del artista" : "Poner foto del artista", `data-name="${esc(a)}"`) + (has ? mi("artimgrm", I.minus, "Quitar foto del artista", `data-name="${esc(a)}"`) : "") +
        mi("playctx", I.play, "Reproducir", `data-key="ar:${esc(a)}"`));
      break;
    }
    case "artimg": closeSheet(); if (!imgOk || !imgWrite) { toast(imgOk ? "Tu llave no permite escribir en el repositorio de imágenes." : "Para fotos de artistas, conecta el repositorio de imágenes en ⚙︎."); break; } pickImage({ type: "artist", name: el.dataset.name }); break;
    case "artimgrm": closeSheet(); (async () => { const k = imgIndex.get(nkey(el.dataset.name)); if (k && await delImage(k)) { rebuild(); renderAll(); toast("Foto quitada"); } })(); break;
    case "plimg": closeSheet(); if (canWrite) pickImage({ type: "pl", id }); break;
    case "plimgrm": {
      closeSheet(); const pl = lib.playlists.find(p => p.id === id); if (!pl) break;
      (async () => {
        const k = hasCover(pl.cover) ? pl.cover : imgIndex.get(nkey(pl.name));
        if (k && k.startsWith("i:")) { const ok = await delImage(k); if (!ok) return; }
        mutate(l => { const q = l.playlists.find(p => p.id === id); if (q) delete q.cover; }); toast("Imagen quitada");
      })(); break;
    }
    case "renpl": { const pl = lib.playlists.find(p => p.id === id); promptSheet({ title: "Cambiar nombre de la playlist", fields: [{ label: "Nombre", value: pl.name }], ok: "Guardar", onOk: ([n]) => { if (!n) return false; mutate(l => { const q = l.playlists.find(p => p.id === id); if (q) q.name = n; }); } }); break; }
    case "delpl": { const pl = lib.playlists.find(p => p.id === id); confirmSheet("¿Borrar playlist?", `Se borrará la playlist <b>${esc(pl.name)}</b>. Las canciones siguen en tu biblioteca.`, "Borrar", () => { mutate(l => { l.playlists = l.playlists.filter(p => p.id !== id); }); detailKey = null; setTab("lib"); toast("Playlist borrada"); }); break; }
    case "addqueuepl": { const pl = lib.playlists.find(p => p.id === id); closeSheet(); unlockAudio(); const ps = plSongs(pl).map(s => s.path); if (!current) startCtx("pl:" + id, 0); else { upNext.push(...ps); toast("Añadida a la cola"); } break; }
    case "addsongs": addSongsSheet(id); break;
    case "togglein": {
      const st = addSongsState; if (!st) break;
      const has = st.inSet.has(path);
      if (has) st.inSet.delete(path); else st.inSet.add(path);
      mutate(l => { const q = l.playlists.find(p => p.id === id); if (!q) return; if (has) q.songs = q.songs.filter(x => x !== path); else if (!q.songs.includes(path)) q.songs.push(path); });
      st.draw(); break;
    }
    case "upload": startUpload(id); break;
    case "settings": settingsSheet(); break;
    case "sort": prefs.sort = sortMode() === "az" ? "recent" : "az"; savePrefs(); renderDetail(); break;
    case "libfilter": prefs.libFilter = el.dataset.f; savePrefs(); renderLib(); break;
    case "color": prefs.color = el.dataset.c; savePrefs(); applyTheme(); document.querySelectorAll("[data-act=color]").forEach(b => b.style.outline = b.dataset.c === prefs.color ? "2px solid #fff" : ""); renderAll(); break;
    case "close": closeSheet(); break;
  }
});
// ---------- imágenes propias (portadas de canciones y playlists) ----------
let imgTarget = null;
async function putImage(cb, name) {
  const path = safeName(name) + ".jpg", key = "i:" + path;
  const body = { message: "Imagen " + name, content: await blobToB64(cb) };
  if (imgSha[key]) body.sha = imgSha[key];
  const j = await (await gh(`${imgRepoPath()}/contents/${encPath(path)}`, { method: "PUT", body: JSON.stringify(body) })).json();
  imgSha[key] = j.content.sha; imgIndex.set(nkey(name), key);
  if (coverUrl.has(key)) URL.revokeObjectURL(coverUrl.get(key));
  coverUrl.set(key, URL.createObjectURL(cb));
  return key;
}
async function delImage(key) {
  if (!imgWrite) { toast("Tu llave no permite borrar en el repositorio de imágenes."); return false; }
  try {
    const path = key.slice(2);
    await gh(`${imgRepoPath()}/contents/${encPath(path)}`, { method: "DELETE", body: JSON.stringify({ message: "Quitar imagen", sha: imgSha[key] }) });
    delete imgSha[key]; for (const [n, k] of imgIndex) if (k === key) imgIndex.delete(n);
    return true;
  } catch(e) { toast("No se pudo quitar: " + explain(e)); return false; }
}
function pickImage(t) { if (!canWrite) { toast("Tu llave no permite cambios."); return; } imgTarget = t; $("imgFile").click(); }
$("imgFile").addEventListener("change", async () => {
  const f = $("imgFile").files[0]; $("imgFile").value = "";
  const t = imgTarget; imgTarget = null;
  if (!f || !t) return;
  toast("Subiendo imagen…");
  try {
    const cb = await makeCover({ mime: f.type || "image/jpeg", data: new Uint8Array(await f.arrayBuffer()) });
    if (!cb) { toast("No se pudo leer esa imagen. Prueba con otra (JPG o PNG)."); return; }
    let cp;
    if (imgOk && imgWrite) {
      // se guarda en el repositorio de imágenes con el nombre de la canción / playlist / artista
      const s0 = t.type === "song" && byPath.get(t.path);
      const pl0 = t.type === "pl" && lib.playlists.find(p => p.id === t.id);
      const name = t.type === "song" ? (s0.artist && s0.artist !== "Artista desconocido" ? `${s0.artist} - ${s0.title}` : s0.title) : t.type === "pl" ? pl0.name : t.name;
      cp = await putImage(cb, name);
    } else {
      if (t.type === "artist") return;
      const hash = await sha1hex(new Uint8Array(await cb.arrayBuffer()));
      cp = `${COVER_DIR}/${hash}.jpg`;
      if (!coverSha[cp]) {
        const j = await (await gh(`${repoPath()}/contents/${encPath(cp)}`, { method: "PUT", body: JSON.stringify({ message: "Imagen", content: await blobToB64(cb) }) })).json();
        coverSha[cp] = j.content.sha; totalBytes += cb.size;
      }
      if (!coverUrl.has(cp)) coverUrl.set(cp, URL.createObjectURL(cb));
    }
    if (t.type === "song") mutate(l => { l.songs[t.path] = { ...(l.songs[t.path] || {}), cover: cp }; });
    else if (t.type === "pl") mutate(l => { const q = l.playlists.find(p => p.id === t.id); if (q) q.cover = cp; });
    else { rebuild(); renderAll(); }
    toast(t.type === "song" ? "Portada cambiada" : t.type === "pl" ? "Imagen de la playlist cambiada" : "Foto del artista cambiada");
    const s = t.type === "song" && current === t.path && byPath.get(t.path); if (s) setMediaSession(s);
  } catch(e) { toast("No se pudo subir la imagen: " + explain(e)); }
});
function toggleLike(path) {
  const s = byPath.get(path); if (!s) return;
  const on = !s.liked;
  mutate(l => { l.songs[path] = { ...(l.songs[path] || {}), liked: on, likedAt: on ? Date.now() : 0 }; });
  toast(on ? "Añadida a Tus me gusta" : "Quitada de Tus me gusta");
}
document.querySelectorAll("#tabbar button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("q").addEventListener("input", renderSearch);
// deslizar hacia abajo para cerrar el reproductor
(() => { let y0 = null; const f = $("full");
  f.addEventListener("touchstart", e => { if (e.target.closest("input")) return; y0 = e.touches[0].clientY; }, { passive: true });
  f.addEventListener("touchend", e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 90) f.classList.remove("on"); y0 = null; }, { passive: true });
})();
window.addEventListener("online", () => { if (!loaded) load(); });

renderAll();
load();
})();
</script>
