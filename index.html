<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://api.github.com; media-src blob:; img-src 'self' data:; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Música">
<meta name="theme-color" content="#0e0e12">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Mi Música</title>
<style>
:root{--bg:#0e0e12;--card:#18181f;--line:#26262f;--txt:#f2f2f5;--mute:#8d8d9a;--acc:#ff4f6d;--acc2:#ff8a5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom))}
header{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.5}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;width:40px;height:40px;font-size:18px;cursor:pointer}
.hbtns{display:flex;gap:8px;align-items:center}
.search{margin:8px 18px 4px}
.search input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 14px;font-size:16px;outline:none}
.tabs{display:flex;gap:8px;padding:8px 18px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.tab.on{color:var(--txt);border-color:var(--acc)}
#status{margin:6px 18px;font-size:13px;color:var(--mute);min-height:18px}
#bar{height:4px;background:var(--line);border-radius:4px;margin:0 18px;overflow:hidden;display:none}
#bar i{display:block;height:100%;width:0;background:var(--acc)}
ul{list-style:none;margin:0;padding:0 8px}
li.song{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer}
li.song:active{background:var(--card)}
li.song.playing .t{color:var(--acc)}
.art{width:44px;height:44px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.meta{flex:1;min-width:0}
.t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{background:none;border:0;color:var(--mute);font-size:22px;padding:6px 10px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:50px 30px;line-height:1.5}
#player{position:fixed;left:0;right:0;bottom:0;background:rgba(20,20,27,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.now{display:flex;align-items:center;gap:12px}
.now .meta .t{font-weight:700}
.ctrl{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:8px}
.ctrl button{background:none;border:0;color:var(--txt);cursor:pointer;padding:4px;display:grid;place-items:center}
.ctrl button.small{color:var(--mute)}
.ctrl button.small.on{color:var(--acc)}
.pp{width:52px;height:52px;border-radius:50%;background:var(--txt)!important;color:var(--bg)!important}
.prog{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute);margin-top:6px}
.prog input{flex:1;accent-color:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:10}
.sheet.on{display:flex}
.sheet .box{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet p{color:var(--mute);font-size:14px;line-height:1.45;margin:6px 0}
.sheet label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.sheet input,.sheet select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-size:16px}
.row{display:flex;gap:10px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:12px;border:0;font-size:15px;font-weight:700;cursor:pointer}
.ghost{background:var(--line);color:var(--txt)}
.danger{background:#3a1820;color:#ff6b81}
.err{color:#ff6b81!important}
</style>
</head>
<body>
<header>
  <div><h1>Mi Música</h1><div class="sub" id="count">—</div></div>
  <div class="hbtns">
    <button class="icon-btn" id="setBtn" title="Ajustes">⚙︎</button>
    <button class="btn" id="addBtn" disabled>＋ Subir</button>
  </div>
  <input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.webm" multiple hidden>
</header>
<div class="search"><input id="q" type="search" placeholder="Buscar canción o artista" autocomplete="off"></div>
<div class="tabs" id="tabs"></div>
<div id="status"></div>
<div id="bar"><i></i></div>
<main id="main"><div class="empty">Cargando…</div></main>

<div id="player">
  <div class="now">
    <div class="art" id="npArt" style="background:var(--line)">♪</div>
    <div class="meta"><div class="t" id="npT">Nada sonando</div><div class="a" id="npA">Elige una canción</div></div>
  </div>
  <div class="prog"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="ctrl">
    <button class="small" id="shuf" title="Aleatorio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button id="prev"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="pp" id="pp"><svg id="ppIcon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="next"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="small" id="rep" title="Repetir"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
  </div>
</div>

<!-- Ajustes / conexión -->
<div class="sheet" id="setup"><div class="box">
  <h2>Conectar con GitHub</h2>
  <p>Tu música está en un repositorio <b>privado</b>. Esta llave se guarda solo en este iPhone.</p>
  <label>Tu usuario de GitHub</label><input id="sOwner" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="p. ej. cris123">
  <label>Repositorio de la música</label><input id="sRepo" autocapitalize="off" autocorrect="off" spellcheck="false" value="mi-musica-privada">
  <label>Carpeta de la música dentro del repositorio</label><input id="sDir" autocapitalize="off" autocorrect="off" spellcheck="false" value="musica">
  <label>Llave (token) de GitHub</label><input id="sTok" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…">
  <label>Calidad al subir canciones</label>
  <select id="sQ">
    <option value="64">64 kbps · ocupa muy poco (~1,7 MB por canción)</option>
    <option value="96" selected>96 kbps · casi como un MP3 bueno (~2,5 MB)</option>
    <option value="128">128 kbps · máxima calidad (~3,4 MB)</option>
    <option value="0">Sin comprimir · subir el archivo tal cual</option>
  </select>
  <p id="sMsg"></p>
  <div class="row"><button class="ghost" id="sCancel">Cancelar</button><button class="btn" id="sSave">Conectar</button></div>
  <div class="row"><button class="danger" id="sForget">Olvidar la llave en este iPhone</button></div>
</div></div>

<!-- Editar canción -->
<div class="sheet" id="sheet"><div class="box">
  <h2 id="eName">Canción</h2>
  <p id="eInfo"></p>
  <div class="row"><button class="ghost" id="eCancel">Cerrar</button></div>
  <div class="row"><button class="danger" id="eDel">Borrar de GitHub</button></div>
</div></div>

<audio id="au" preload="auto" playsinline></audio>

<script>
(() => {
const $ = id => document.getElementById(id);
const au = $("au");
const AUDIO_RE = /\.(mp3|m4a|aac|wav|flac|ogg|opus|webm|aiff?|caf)$/i;
const MIME = { mp3:"audio/mpeg", m4a:"audio/mp4", aac:"audio/aac", wav:"audio/wav", flac:"audio/flac", ogg:"audio/ogg", opus:"audio/ogg", webm:"audio/webm", aif:"audio/aiff", aiff:"audio/aiff", caf:"audio/x-caf" };

// ---------- ajustes guardados en este iPhone ----------
let cfg = {};
try { cfg = JSON.parse(localStorage.getItem("mimusica.cfg") || "{}"); } catch(e) { cfg = {}; }
const saveCfg = () => { try { localStorage.setItem("mimusica.cfg", JSON.stringify(cfg)); } catch(e) {} };
let canWrite = false, branch = "main", emptyRepo = false;

let songs = [], view = [], queue = [], idx = -1, shuffle = false, repeat = false, filterPl = "", editing = null;
const urlCache = new Map(); // sha -> objectURL

const hue = s => { let h = 0; for (const c of (s||"?")) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
const artStyle = s => `background:linear-gradient(135deg,hsl(${hue(s)},70%,50%),hsl(${(hue(s)+50)%360},70%,40%))`;
const fmt = t => !isFinite(t) ? "0:00" : Math.floor(t/60) + ":" + String(Math.floor(t%60)).padStart(2,"0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const status = (m, bad) => { $("status").textContent = m || ""; $("status").className = bad ? "err" : ""; };
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- API de GitHub ----------
async function gh(path, opts = {}) {
  const r = await fetch("https://api.github.com" + path, {
    ...opts,
    cache: "no-store",
    headers: { "Authorization": "Bearer " + cfg.token, "Accept": opts.accept || "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) }
  });
  if (!r.ok) {
    let msg = r.status + "";
    try { const j = await r.json(); if (j.message) msg += " · " + j.message; } catch(e) {}
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return r;
}
const repoPath = () => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;
const dirPrefix = () => (cfg.dir || "").replace(/^\/+|\/+$/g, "");

function explain(e) {
  if (!navigator.onLine) return "Sin conexión a internet.";
  if (e.status === 401) return "La llave no es válida o ha caducado. Crea una nueva en GitHub.";
  if (e.status === 403) return "La llave no tiene permiso o GitHub ha limitado las peticiones. " + e.message;
  if (e.status === 404) return "No encuentro ese repositorio o carpeta. Revisa usuario, nombre del repositorio y que la llave tenga acceso a él.";
  if (e.status === 409) return "El repositorio está vacío. Sube al menos un archivo desde github.com primero.";
  return "Error: " + (e.message || e);
}

function guessMeta(path) {
  const name = path.split("/").pop();
  let base = name.replace(/\.[^.]+$/, "").replace(/_/g, " ").replace(/^\d+[\s.\-]+/, "").trim();
  const p = base.split(" - ");
  return p.length >= 2 ? { artist: p[0].trim(), title: p.slice(1).join(" - ").trim() } : { artist: "Desconocido", title: base };
}

async function load(doneMsg) {
  if (!cfg.token || !cfg.owner || !cfg.repo) { openSetup(); render(); return; }
  status("Conectando con GitHub…");
  try {
    const info = await (await gh(repoPath())).json();
    branch = info.default_branch || "main";
    canWrite = !!(info.permissions && info.permissions.push);
    if (!info.private) status("⚠️ Este repositorio es PÚBLICO: cualquiera puede ver tu música. Hazlo privado en GitHub (Settings → Danger Zone).", true);
    let tree = []; emptyRepo = false;
    try {
      const t = await (await gh(`${repoPath()}/git/trees/${encodeURIComponent(branch)}?recursive=1`)).json();
      tree = t.tree || [];
      if (t.truncated) status("La biblioteca es muy grande; puede que falten algunas canciones.", true);
    } catch(e) { if (e.status !== 409 && e.status !== 404) throw e; emptyRepo = true; }
    const pre = dirPrefix(); const preS = pre ? pre + "/" : "";
    songs = tree.filter(x => x.type === "blob" && AUDIO_RE.test(x.path) && x.path.startsWith(preS)).map(x => {
      const rel = x.path.slice(preS.length);
      const parts = rel.split("/");
      const m = guessMeta(x.path);
      return { path: x.path, sha: x.sha, size: x.size, title: m.title, artist: m.artist, playlist: parts.length > 1 ? parts.slice(0, -1).join(" / ") : "" };
    }).sort((a, b) => (a.artist + a.title).localeCompare(b.artist + b.title, "es"));
    $("addBtn").disabled = !canWrite;
    if (info.private) status(doneMsg || (canWrite ? "" : "Modo solo escuchar: la llave no permite subir canciones."));
    render();
  } catch(e) {
    status(explain(e), true);
    $("main").innerHTML = `<div class="empty">No se pudo cargar tu música.<br>Pulsa ⚙︎ para revisar la conexión.</div>`;
  }
}

function render(){
  const q = $("q").value.trim().toLowerCase();
  view = songs.filter(s => (!filterPl || s.playlist === filterPl) && (!q || (s.title + " " + s.artist).toLowerCase().includes(q)));
  $("count").textContent = cfg.token ? songs.length + (songs.length === 1 ? " canción" : " canciones") + " en GitHub" : "Sin conectar";
  const pls = [...new Set(songs.map(s => s.playlist).filter(Boolean))].sort();
  $("tabs").innerHTML = pls.length ? [`<button class="tab ${!filterPl?"on":""}" data-p="">Todas</button>`]
    .concat(pls.map(p => `<button class="tab ${filterPl===p?"on":""}" data-p="${esc(p)}">${esc(p)}</button>`)).join("") : "";
  const cur = queue[idx];
  if (!cfg.token) { $("main").innerHTML = `<div class="empty">Pulsa ⚙︎ para conectar tu repositorio de GitHub.</div>`; return; }
  if (!songs.length) { $("main").innerHTML = `<div class="empty">No hay canciones todavía.<br>Pulsa <b>＋ Subir</b> o súbelas en github.com a la carpeta <b>${esc(dirPrefix() || "(raíz)")}</b>.<br><br>Consejo: llama a los archivos <i>Artista - Canción.mp3</i>. Las subcarpetas se convierten en playlists.</div>`; return; }
  if (!view.length) { $("main").innerHTML = `<div class="empty">Sin resultados.</div>`; return; }
  $("main").innerHTML = "<ul>" + view.map((s,i) => `<li class="song ${cur && cur.path===s.path?"playing":""}" data-i="${i}">
    <div class="art" style="${artStyle(s.artist)}">${esc((s.title||"?")[0].toUpperCase())}</div>
    <div class="meta"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}${s.playlist?" · "+esc(s.playlist):""}</div></div>
    <button class="more" data-e="${esc(s.path)}">⋯</button></li>`).join("") + "</ul>";
}

$("tabs").onclick = e => { const b = e.target.closest(".tab"); if (b) { filterPl = b.dataset.p; render(); } };
$("q").oninput = render;
$("main").onclick = e => {
  const ed = e.target.closest(".more"); if (ed) { openEdit(ed.dataset.e); return; }
  const li = e.target.closest("li.song"); if (!li) return;
  queue = view.slice(); idx = +li.dataset.i;
  if (shuffle) { const first = queue.splice(idx,1)[0]; queue.sort(() => Math.random()-.5); queue.unshift(first); idx = 0; }
  play();
};

// ---------- reproducción ----------
async function getUrl(s) {
  if (urlCache.has(s.sha)) return urlCache.get(s.sha);
  const r = await gh(`${repoPath()}/git/blobs/${s.sha}`, { accept: "application/vnd.github.raw" });
  const buf = await r.arrayBuffer();
  const ext = s.path.split(".").pop().toLowerCase();
  const url = URL.createObjectURL(new Blob([buf], { type: MIME[ext] || "audio/mpeg" }));
  urlCache.set(s.sha, url);
  // mantener solo unas pocas en memoria (no se guardan en el iPhone)
  const keep = new Set([queue[idx], queue[idx+1], queue[idx-1]].filter(Boolean).map(x => x.sha));
  for (const [k, u] of urlCache) if (!keep.has(k) && urlCache.size > 3) { URL.revokeObjectURL(u); urlCache.delete(k); }
  return url;
}
let playToken = 0;
async function play(){
  const s = queue[idx]; if (!s) return;
  const my = ++playToken;
  $("npT").textContent = s.title; $("npA").textContent = "Cargando…";
  $("npArt").setAttribute("style", artStyle(s.artist)); $("npArt").textContent = (s.title||"?")[0].toUpperCase();
  render();
  try {
    const url = await getUrl(s);
    if (my !== playToken) return;
    au.src = url;
    await au.play().catch(() => status("Pulsa ▶ para reproducir."));
    $("npA").textContent = s.artist;
    try { if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: s.artist, album: s.playlist || "Mi Música" }); } catch(e){}
    const n = queue[(idx + 1) % queue.length]; if (n && n !== s) getUrl(n).catch(()=>{}); // precarga la siguiente
  } catch(e) { if (my === playToken) { $("npA").textContent = s.artist; status(explain(e), true); } }
}
const next = () => { if (!queue.length) return; idx = (idx + 1) % queue.length; play(); };
const prev = () => { if (!queue.length) return; if (au.currentTime > 3) { au.currentTime = 0; return; } idx = (idx - 1 + queue.length) % queue.length; play(); };
$("next").onclick = next; $("prev").onclick = prev;
$("pp").onclick = () => {
  if (!au.src) { if (view.length) { queue = view.slice(); idx = 0; play(); } return; }
  au.paused ? au.play().catch(()=>{}) : au.pause();
};
$("shuf").onclick = () => { shuffle = !shuffle; $("shuf").classList.toggle("on", shuffle); };
$("rep").onclick = () => { repeat = !repeat; $("rep").classList.toggle("on", repeat); };
au.onended = () => { if (repeat) { au.currentTime = 0; au.play().catch(()=>{}); } else next(); };
const setIcon = () => $("ppIcon").innerHTML = au.paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
au.onplay = au.onpause = setIcon;
au.onerror = () => { if (au.src) status("Este iPhone no puede reproducir esta canción (formato no compatible).", true); };
let seeking = false;
$("seek").oninput = () => { seeking = true; $("cur").textContent = fmt($("seek").value/1000 * au.duration); };
$("seek").onchange = () => { if (isFinite(au.duration)) au.currentTime = $("seek").value/1000 * au.duration; seeking = false; };
au.ontimeupdate = () => { if (!seeking && isFinite(au.duration)) $("seek").value = au.currentTime/au.duration*1000; $("cur").textContent = fmt(au.currentTime); $("dur").textContent = fmt(au.duration); };
try {
  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", () => au.play());
    navigator.mediaSession.setActionHandler("pause", () => au.pause());
    navigator.mediaSession.setActionHandler("nexttrack", next);
    navigator.mediaSession.setActionHandler("previoustrack", prev);
  }
} catch(e){}

// ---------- ajustes ----------
function openSetup() {
  $("sOwner").value = cfg.owner || ""; $("sRepo").value = cfg.repo || "mi-musica-privada";
  $("sDir").value = cfg.dir ?? "musica"; $("sTok").value = cfg.token || ""; $("sQ").value = String(cfg.q ?? 96);
  $("sMsg").textContent = ""; $("sMsg").className = "";
  $("setup").classList.add("on");
}
$("setBtn").onclick = openSetup;
$("sCancel").onclick = () => $("setup").classList.remove("on");
$("sSave").onclick = async () => {
  const n = { owner: $("sOwner").value.trim(), repo: $("sRepo").value.trim(), dir: $("sDir").value.trim().replace(/^\/+|\/+$/g, ""), token: $("sTok").value.trim(), q: +$("sQ").value };
  if (!n.owner || !n.repo || !n.token) { $("sMsg").textContent = "Rellena usuario, repositorio y llave."; $("sMsg").className = "err"; return; }
  const old = cfg; cfg = n;
  $("sMsg").textContent = "Comprobando…"; $("sMsg").className = "";
  try { await gh(repoPath()); saveCfg(); $("setup").classList.remove("on"); urlCache.clear(); load(); }
  catch(e) { $("sMsg").textContent = explain(e); $("sMsg").className = "err"; cfg = old; }
};
$("sForget").onclick = () => {
  cfg = {}; saveCfg(); try { localStorage.removeItem("mimusica.cfg"); } catch(e) {}
  songs = []; au.pause(); au.removeAttribute("src"); $("setup").classList.remove("on"); render(); status("Llave borrada de este iPhone.");
};

// ---------- detalles / borrar ----------
function openEdit(path){
  editing = songs.find(s => s.path === path); if (!editing) return;
  $("eName").textContent = editing.title;
  $("eInfo").innerHTML = `${esc(editing.artist)}${editing.playlist ? " · " + esc(editing.playlist) : ""}<br>${(editing.size/1048576).toFixed(1)} MB · <span style="word-break:break-all">${esc(editing.path)}</span>`;
  $("eDel").style.display = canWrite ? "" : "none";
  $("eDel").textContent = "Borrar de GitHub"; $("eDel").dataset.sure = "";
  $("sheet").classList.add("on");
}
$("eCancel").onclick = () => $("sheet").classList.remove("on");
$("sheet").onclick = e => { if (e.target.id === "sheet") $("sheet").classList.remove("on"); };
$("setup").onclick = e => { if (e.target.id === "setup" && cfg.token) $("setup").classList.remove("on"); };
$("eDel").onclick = async () => {
  if (!editing) return;
  if (!$("eDel").dataset.sure) { $("eDel").dataset.sure = "1"; $("eDel").textContent = "Pulsa otra vez para borrar"; return; }
  const s = editing; $("sheet").classList.remove("on");
  try {
    const meta = await (await gh(`${repoPath()}/contents/${encPath(s.path)}?ref=${encodeURIComponent(branch)}`)).json();
    await gh(`${repoPath()}/contents/${encPath(s.path)}`, { method: "DELETE", body: JSON.stringify({ message: "Borrar " + s.path.split("/").pop(), sha: meta.sha, branch }) });
    load("Borrada: " + s.title);
  } catch(e) { status(explain(e), true); }
};

// ---------- compresión a Opus (WebM) en el propio iPhone ----------
function makeWebm(packets, opts) {
  // packets: [{data: Uint8Array, ts: microseconds}] ; opts: {channels, sampleRate, durationMs, opusHead?}
  const enc = new TextEncoder();
  const idBytes = id => { const b = []; let v = id; while (v > 0) { b.unshift(v & 255); v = Math.floor(v / 256); } return b; };
  const sizeBytes = n => { // EBML vint, 8 bytes max
    for (let len = 1; len <= 8; len++) {
      if (n < Math.pow(2, 7 * len) - 1) {
        const out = new Array(len); let v = n;
        for (let i = len - 1; i >= 0; i--) { out[i] = v % 256; v = Math.floor(v / 256); }
        out[0] |= 1 << (8 - len);
        return out;
      }
    }
    throw new Error("too big");
  };
  const uint = n => { const b = []; do { b.unshift(n % 256); n = Math.floor(n / 256); } while (n > 0); return b; };
  const concat = arrs => { let len = 0; for (const a of arrs) len += a.length; const out = new Uint8Array(len); let o = 0; for (const a of arrs) { out.set(a, o); o += a.length; } return out; };
  const el = (id, payload) => { const p = payload instanceof Uint8Array ? payload : Uint8Array.from(payload); return concat([Uint8Array.from(idBytes(id)), Uint8Array.from(sizeBytes(p.length)), p]); };
  const elU = (id, n) => el(id, uint(n));
  const elS = (id, s) => el(id, enc.encode(s));
  const elF = (id, f) => { const b = new Uint8Array(8); new DataView(b.buffer).setFloat64(0, f); return el(id, b); };

  const ch = opts.channels, sr = opts.sampleRate;
  let head = opts.opusHead;
  if (!head || head.length < 19) {
    head = new Uint8Array(19); const dv = new DataView(head.buffer);
    head.set(enc.encode("OpusHead"), 0); head[8] = 1; head[9] = ch;
    dv.setUint16(10, 312, true); dv.setUint32(12, sr, true); dv.setInt16(16, 0, true); head[18] = 0;
  }
  const ebml = el(0x1A45DFA3, concat([elU(0x4286, 1), elU(0x42F7, 1), elU(0x42F2, 4), elU(0x42F3, 8), elS(0x4282, "webm"), elU(0x4287, 4), elU(0x4285, 2)]));
  const info = el(0x1549A966, concat([elU(0x2AD7B1, 1000000), elS(0x4D80, "MiMusica"), elS(0x5741, "MiMusica"), elF(0x4489, opts.durationMs)]));
  const tracks = el(0x1654AE6B, el(0xAE, concat([
    elU(0xD7, 1), elU(0x73C5, 1), elU(0x83, 2), elS(0x86, "A_OPUS"), el(0x63A2, head),
    elU(0x56AA, 6500000), elU(0x56BB, 80000000),
    el(0xE1, concat([elF(0xB5, sr), elU(0x9F, ch)]))
  ])));

  // Clusters of ~2s each
  const clusters = []; let i = 0;
  while (i < packets.length) {
    const startMs = Math.floor(packets[i].ts / 1000);
    const blocks = [elU(0xE7, startMs)];
    while (i < packets.length) {
      const rel = Math.round(packets[i].ts / 1000) - startMs;
      if (rel > 2000 || rel > 32767) break;
      const hdr = new Uint8Array(4); hdr[0] = 0x81; new DataView(hdr.buffer).setInt16(1, rel); hdr[3] = 0x80;
      blocks.push(el(0xA3, concat([hdr, packets[i].data])));
      i++;
    }
    clusters.push({ timeMs: startMs, bytes: el(0x1F43B675, concat(blocks)) });
  }
  // Cues: positions relative to segment data start. Layout: Info, Tracks, Cues(placeholder-size computed iteratively), Clusters
  let cuesBytes = new Uint8Array(0);
  for (let pass = 0; pass < 3; pass++) {
    let pos = info.length + tracks.length + cuesBytes.length;
    const points = [];
    for (const c of clusters) {
      points.push(el(0xBB, concat([elU(0xB3, c.timeMs), el(0xB7, concat([elU(0xF7, 1), elU(0xF1, pos)]))])));
      pos += c.bytes.length;
    }
    cuesBytes = el(0x1C53BB6B, concat(points));
  }
  const segBody = concat([info, tracks, cuesBytes, ...clusters.map(c => c.bytes)]);
  const segment = el(0x18538067, segBody);
  return concat([ebml, segment]);
}


async function toWebm(file, onProg, kbps){
  if (typeof AudioEncoder === "undefined" || typeof AudioData === "undefined") throw new Error("NOENC");
  const cfg = { codec: "opus", sampleRate: 48000, numberOfChannels: 2, bitrate: (kbps || 96) * 1000 };
  try { const s = await AudioEncoder.isConfigSupported(cfg); if (!s.supported) throw 0; } catch(e) { throw new Error("NOENC"); }
  const ab = await file.arrayBuffer();
  const ctx = new OfflineAudioContext(2, 48000, 48000);
  const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
  const L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
  const packets = []; let head = null, err = null;
  const encoder = new AudioEncoder({
    output: (chunk, meta) => {
      const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d);
      packets.push({ data: d, ts: chunk.timestamp });
      const desc = meta && meta.decoderConfig && meta.decoderConfig.description;
      if (desc && !head) {
        const u = desc instanceof ArrayBuffer ? new Uint8Array(desc) : new Uint8Array(desc.buffer, desc.byteOffset, desc.byteLength);
        if (u.length >= 19 && String.fromCharCode(...u.slice(0, 8)) === "OpusHead") head = u.slice();
      }
    },
    error: e => { err = e; }
  });
  encoder.configure(cfg);
  const N = buf.length, step = 48000;
  for (let off = 0; off < N; off += step) {
    if (err) throw err;
    const n = Math.min(step, N - off);
    const data = new Float32Array(n * 2);
    data.set(L.subarray(off, off + n), 0); data.set(R.subarray(off, off + n), n);
    const ad = new AudioData({ format: "f32-planar", sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(off / 48000 * 1e6), data });
    encoder.encode(ad); ad.close();
    if (encoder.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 0));
    if (onProg) onProg(off / N);
  }
  await encoder.flush(); encoder.close();
  if (err) throw err;
  if (!packets.length) throw new Error("vacío");
  packets.sort((a, b) => a.ts - b.ts);
  const out = makeWebm(packets, { channels: 2, sampleRate: 48000, durationMs: buf.duration * 1000, opusHead: head });
  return new Blob([out], { type: "video/webm" });
}



// ---------- subida ----------
const blobToB64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(b); });
const safeName = s => s.replace(/[\\/:*?"<>|#%]/g, "").replace(/\s+/g, " ").trim().slice(0, 120) || "cancion";

$("addBtn").onclick = () => $("file").click();
$("file").onchange = async () => {
  const files = [...$("file").files]; $("file").value = "";
  if (!files.length || !canWrite) return;
  $("addBtn").disabled = true; $("bar").style.display = "block";
  const bitrate = cfg.q ?? 96;
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const setBar = p => $("bar").firstElementChild.style.width = ((i + p) / files.length * 100) + "%";
    try {
      let blob = f, ext = (f.name.split(".").pop() || "mp3").toLowerCase();
      if (bitrate > 0 && !/\.(webm)$/i.test(f.name)) {
        try {
          blob = await toWebm(f, p => { status(`Comprimiendo ${i+1}/${files.length}: ${f.name} (${Math.round(p*100)}%)`); setBar(p * 0.7); }, bitrate);
          ext = "webm";
        } catch(e) {
          if (e && e.message === "NOENC") { status("Este iPhone no puede comprimir aquí; se sube el archivo original.", true); await sleep(1500); blob = f; }
          else throw e;
        }
      }
      if (blob.size > 45 * 1024 * 1024) { status(`${f.name} es demasiado grande para subirla desde la app.`, true); await sleep(2000); continue; }
      status(`Subiendo ${i+1}/${files.length}: ${f.name} (${(blob.size/1048576).toFixed(1)} MB)`); setBar(0.75);
      const base = safeName(f.name.replace(/\.[^.]+$/, ""));
      const folder = [dirPrefix(), filterPl ? filterPl.split(" / ").join("/") : ""].filter(Boolean).join("/");
      let path = (folder ? folder + "/" : "") + base + "." + ext;
      if (songs.some(s => s.path === path)) path = (folder ? folder + "/" : "") + base + " (" + Date.now().toString(36) + ")." + ext;
      const content = await blobToB64(blob);
      await gh(`${repoPath()}/contents/${encPath(path)}`, { method: "PUT", body: JSON.stringify(emptyRepo ? { message: "Añadir " + base, content } : { message: "Añadir " + base, content, branch }) });
      ok++; setBar(1);
    } catch(e) { status(`Error con ${f.name}: ${explain(e)}`, true); await sleep(2500); }
  }
  setTimeout(() => { $("bar").style.display = "none"; }, 600);
  $("addBtn").disabled = false;
  if (ok) load(`${ok} canción(es) subida(s) a GitHub.`); else status("No se subió ninguna canción.", true);
};

window.addEventListener("online", () => { if (!songs.length) load(); });
load();
})();
